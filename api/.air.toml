root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server"
entrypoint = ["./tmp/main"]
delay = 1000
exclude_dir = ["tmp", "vendor", "db"]
exclude_file = []
include_ext = ["go", "env"]
kill_delay = "500ms"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true